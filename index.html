<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta
      name="description"
      content="A. Nahhas's academic e-portfolio, documenting work from the MSc Artificial Intelligence programme at the University of Essex."
    />
    <title>A. Nahhas · E-portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-glow" aria-hidden="true"></div>
    <div id="site-header"></div>

    <main id="main-content">
      <section class="hero shell" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">Portfolio</p>
          <h1 id="hero-title"></h1>
          <p class="hero-role" id="hero-role"></p>
          <p class="hero-summary" id="hero-summary"></p>
        </div>
        <div class="profile-card" aria-label="Study profile">
          <div class="profile-monogram" id="profile-monogram" aria-hidden="true"></div>
          <div>
            <p class="profile-name" id="profile-name"></p>
            <p class="profile-program" id="profile-program"></p>
          </div>
          <dl class="profile-facts" id="profile-facts"></dl>
        </div>
      </section>

      <section class="modules-section shell" id="modules" aria-labelledby="modules-title">
        <div class="section-heading">
          <div>
            <p class="section-label">Selected work</p>
            <h2 id="modules-title">Portfolio work</h2>
          </div>
          <p>Module work, practical activities, reflections, and assessments from my MSc studies.</p>
        </div>
        <div class="module-list" id="module-list"></div>
      </section>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
